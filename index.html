<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana NFT Minter | Vanilla JS</title>
    
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <style>
        /* --- VARIÁVEIS E RESET (Princípio: Harmonia) --- */
        :root {
            --bg-color: #0d0d0d; /* Almost Black */
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-purple: #9945FF;
            --accent-green: #14F195;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --spacing-unit: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- LAYOUT E ESTRUTURA (Princípios: Alinhamento e Espaço Branco) --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-unit);
        }

        /* Header com efeito Glassmorphism */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* --- UI ELEMENTS (Princípios: Ênfase e Hierarquia) --- */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-green));
            color: #000;
            box-shadow: 0 4px 15px rgba(153, 69, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(20, 241, 149, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        /* --- MAIN CONTENT (Grid para telas grandes, Flex para mobile) --- */
        main {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: flex-start;
        }

        /* Área de Upload (Esquerda) */
        .upload-section {
            flex: 1;
            min-width: 300px;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: var(--card-bg);
            border: 2px dashed #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .preview-box:hover {
            border-color: var(--accent-green);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Escondido por padrão */
        }

        .preview-placeholder {
            text-align: center;
            color: var(--text-secondary);
            pointer-events: none;
        }

        input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Formulário (Direita) */
        .form-section {
            flex: 1;
            min-width: 300px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--accent-green);
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-purple);
        }

        /* --- FEEDBACK VISUAL --- */
        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }
        
        .success { color: var(--accent-green); }
        .error { color: #ff4b4b; }
        .loading { color: var(--accent-purple); }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">SOL MINTER</div>
            <button id="btn-connect" class="btn btn-outline">Conectar Wallet</button>
        </header>

        <main>
            <section class="upload-section">
                <div class="preview-box" id="drop-zone">
                    <img id="image-preview" alt="Preview da Arte">
                    <div class="preview-placeholder" id="placeholder-text">
                        <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:10px; opacity:0.5;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p>Clique ou arraste sua arte</p>
                        <small style="opacity: 0.6">JPG, PNG, GIF</small>
                    </div>
                    <input type="file" id="file-input" accept="image/*">
                </div>
            </section>

            <section class="form-section">
                <h1>Crie seu Legado</h1>
                <p class="subtitle">Transforme sua arte digital em um ativo eterno na Blockchain Solana.</p>

                <div class="input-group">
                    <label>Nome da Obra</label>
                    <input type="text" id="nft-name" placeholder="Ex: Cyberpunk #2077">
                </div>

                <div class="input-group">
                    <label>Descrição</label>
                    <textarea id="nft-desc" rows="4" placeholder="Conte a história dessa arte..."></textarea>
                </div>

                <button id="btn-mint" class="btn btn-primary" style="width: 100%" disabled>
                    Mintar NFT
                </button>

                <div id="status-msg"></div>
            </section>
        </main>
    </div>

    <script>
        // --- 1. VARIÁVEIS GLOBAIS ---
        let walletAddress = null;
        let connection = null;

        // Referências do DOM (Cache dos elementos)
        const btnConnect = document.getElementById('btn-connect');
        const btnMint = document.getElementById('btn-mint');
        const fileInput = document.getElementById('file-input');
        const imgPreview = document.getElementById('image-preview');
        const placeholder = document.getElementById('placeholder-text');
        const statusMsg = document.getElementById('status-msg');

        // --- 2. FUNÇÕES DE UTILIDADE (Design de Feedback) ---
        function setStatus(msg, type = 'normal') {
            statusMsg.textContent = msg;
            statusMsg.className = type;
        }

        // --- 3. CONEXÃO COM WALLET (Phantom) ---
        async function connectWallet() {
            // Verifica se o objeto solana existe no navegador (injetado pela Phantom)
            const { solana } = window;

            if (solana && solana.isPhantom) {
                try {
                    setStatus('Conectando...', 'loading');
                    // Solicita conexão
                    const response = await solana.connect();
                    walletAddress = response.publicKey.toString();
                    
                    // Atualiza UI
                    btnConnect.textContent = walletAddress.slice(0, 4) + '...' + walletAddress.slice(-4);
                    btnConnect.style.background = 'var(--accent-purple)';
                    btnConnect.style.color = 'white';
                    
                    // Inicializa conexão com a rede Devnet
                    connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('devnet'), 'confirmed');
                    
                    setStatus('Carteira conectada! Rede: Devnet', 'success');
                    checkFormValidity();
                } catch (err) {
                    console.error(err);
                    setStatus('Usuário rejeitou a conexão.', 'error');
                }
            } else {
                alert('Carteira Phantom não encontrada! Por favor instale a extensão.');
                window.open('https://phantom.app/', '_blank');
            }
        }

        // --- 4. PREVIEW DE IMAGEM ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block';
                    placeholder.style.display = 'none';
                    checkFormValidity();
                }
                reader.readAsDataURL(file);
            }
        });

        // Habilita o botão apenas se tiver wallet + arquivo
        function checkFormValidity() {
            if (walletAddress && fileInput.files.length > 0) {
                btnMint.disabled = false;
                btnMint.style.opacity = "1";
                btnMint.style.cursor = "pointer";
            } else {
                btnMint.disabled = true;
                btnMint.style.opacity = "0.5";
                btnMint.style.cursor = "not-allowed";
            }
        }

        // --- 5. LÓGICA DE "MINT" (SIMULADA PARA VANILLA) ---
        // Nota: Um mint real de NFT Metaplex em JS puro (sem bundler/node) é extremamente complexo
        // devido a dependências de Buffer e layouts.
        // Aqui simularemos a experiência completa enviando uma transação real de SOL (taxa simbólica).
        
        async function mintNFT() {
            if (!walletAddress || !connection) return;

            const name = document.getElementById('nft-name').value;
            if(!name) { setStatus('Dê um nome para sua arte!', 'error'); return; }

            try {
                setStatus('Iniciando processo de Mint...', 'loading');
                btnMint.textContent = 'Processando...';
                btnMint.disabled = true;

                // Passo 1: Simulação de Upload (Delay)
                setStatus('Fazendo upload da imagem para o IPFS...', 'loading');
                await new Promise(r => setTimeout(r, 2000)); // Espera 2s fake

                // Passo 2: Construção da Transação Real (Prova de Interação)
                // Vamos criar uma transação de transferência para si mesmo como "Proof of Mint"
                setStatus('Aguardando aprovação na carteira...', 'loading');

                const { solana } = window;
                const publicKey = await window.solana.publicKey; // Objeto PublicKey real

                // Cria instrução de transação
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: publicKey,
                        toPubkey: publicKey, // Envia para si mesmo (custo apenas de gás)
                        lamports: solanaWeb3.LAMPORTS_PER_SOL * 0.001, // 0.001 SOL taxa ficticia
                    })
                );

                // Define blockhash recente (necessário para Solana)
                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = publicKey;

                // Solicita assinatura e envio
                const { signature } = await solana.signAndSendTransaction(transaction);
                
                // Aguarda confirmação
                setStatus('Confirmando na Blockchain...', 'loading');
                await connection.confirmTransaction(signature);

                // Sucesso
                setStatus(`Sucesso! Hash: ${signature.slice(0,10)}...`, 'success');
                alert('Parabéns! Sua arte foi registrada (Simulação de Mint completada).');
                
                // Reset visual
                btnMint.textContent = 'Mintado com Sucesso';
                btnMint.style.background = 'var(--accent-green)';

            } catch (err) {
                console.error("Erro:", err);
                setStatus('Erro na transação. Verifique o console.', 'error');
                btnMint.textContent = 'Tentar Novamente';
                btnMint.disabled = false;
            }
        }

        // Event Listeners
        btnConnect.addEventListener('click', connectWallet);
        btnMint.addEventListener('click', mintNFT);

    </script>
</body>
</html>
